<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Home</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #87CEEB; /* Light blue background */
            font-family: Arial, sans-serif;
        }

        .box {
            background-color: white;
            padding: 20px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 60%;
            max-width: 500px;
        }

        .box h1 {
            margin-top: 0;
            color: #4CAF50; /* Green text for welcome */
        }

        .box p {
            color: #333;
            font-size: 16px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Welcome to Home</h1>
        <p>
            This page is accessible for all!
        </p>
    </div>
</body>
</html>
