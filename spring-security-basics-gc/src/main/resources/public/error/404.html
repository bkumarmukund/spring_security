<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #ff4e50, #f9d423);
      color: white;
      text-align: center;
    }
    .container {
      max-width: 600px;
    }
    h1 {
      font-size: 10rem;
      margin: 0;
    }
    h2 {
      font-size: 2rem;
      margin: 0.5rem 0 2rem;
    }
    p {
      font-size: 1rem;
      margin-bottom: 2rem;
    }
    a {
      text-decoration: none;
      background: #fff;
      color: #ff4e50;
      padding: 0.8rem 1.5rem;
      font-size: 1rem;
      border-radius: 50px;
      transition: background 0.3s ease;
    }
    a:hover {
      background: #ff4e50;
      color: #fff;
    }
    @media (max-width: 768px) {
      h1 {
        font-size: 6rem;
      }
      h2 {
        font-size: 1.5rem;
      }
      p {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Oops! Page Not Found</h2>
    <p>We're sorry, but the page you are looking for doesn't exist.</p>
    <a href="/">Go Back to Home</a>
  </div>
</body>
</html>
