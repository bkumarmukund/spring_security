<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #f05454, #30475e);
            color: #fff;
        }
        .container {
            text-align: center;
            max-width: 600px;
        }
        .container h1 {
            font-size: 120px;
            margin: 0;
            line-height: 1;
            color: #ffd369;
        }
        .container h2 {
            font-size: 36px;
            margin: 10px 0;
        }
        .container p {
            font-size: 18px;
            margin: 20px 0;
            color: #eeeeee;
        }
        .container a {
            display: inline-block;
            padding: 10px 20px;
            margin-top: 20px;
            background: #ffd369;
            color: #30475e;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .container a:hover {
            background: #ffcc29;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>Oops! The page you are looking for doesn't exist or has been moved.</p>
        <a href="/">Go Back to Home</a>
    </div>
</body>
</html>
